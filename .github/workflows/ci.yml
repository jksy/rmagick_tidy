name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / RMagick ${{ matrix.rmagick }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        rmagick: ["6", "7"]

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rmagick_${{ matrix.rmagick }}.gemfile

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install ImageMagick 7
        uses: jksy/setup-imagemagick@8a5aa8425e833611e5d340400f137f2e98260bba  # v1.2.1
        with:
          version: "7.1.2-21"

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74  # v1.314.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec (with coverage)
        env:
          COVERAGE: "1"
        run: bundle exec rspec

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ruby-${{ matrix.ruby }}-rmagick-${{ matrix.rmagick }}
          path: coverage
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        # Only upload from one matrix cell to avoid duplicate reports.
        if: matrix.ruby == '3.3' && matrix.rmagick == '7'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: rspec
          fail_ci_if_error: false

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # rmagick is a runtime dependency of this gem and builds a C extension
      # against ImageMagick headers, so `bundle install` needs ImageMagick
      # available even though RuboCop itself doesn't use it.
      - name: Install ImageMagick 7
        uses: jksy/setup-imagemagick@8a5aa8425e833611e5d340400f137f2e98260bba  # v1.2.1
        with:
          version: "7.1.2-21"

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74  # v1.314.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop
