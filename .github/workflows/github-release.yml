name: github-release

# Creates the GitHub Release for a version tag pushed by `rake release`,
# with notes generated from merged PRs and grouped by .github/release.yml.
# The tag is pushed with a person's credentials (not GITHUB_TOKEN), so
# this workflow is triggered.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create release
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
