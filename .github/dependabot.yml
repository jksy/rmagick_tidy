version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The official tool images that CI runs, pinned by tag and digest in
  # the Dockerfiles under .github/tools/.
  - package-ecosystem: "docker"
    directories:
      - "/.github/tools/actionlint"
      - "/.github/tools/gitleaks"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
